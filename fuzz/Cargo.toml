[package]
name = "k7d-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "agent_protocol"
path = "fuzz_targets/agent_protocol.rs"
doc = false

[[bin]]
name = "blk_request"
path = "fuzz_targets/blk_request.rs"
doc = false

[[bin]]
name = "broker_paths"
path = "fuzz_targets/broker_paths.rs"
doc = false

[[bin]]
name = "control_request"
path = "fuzz_targets/control_request.rs"
doc = false

[dependencies]
libfuzzer-sys = "=0.4.7"
serde_json = "=1.0.149"
k7d = { path = "../crates/k7d" }
