[package]
name = "k7d"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "k7d"
path = "src/lib.rs"

[[bin]]
name = "k7d"
path = "src/main.rs"

[dependencies]
kvm-ioctls.workspace = true
kvm-bindings = { workspace = true, features = ["fam-wrappers"] }
vm-memory = { workspace = true, features = ["backend-mmap"] }
linux-loader = { workspace = true, features = ["elf", "bzimage"] }
vm-superio.workspace = true
vmm-sys-util.workspace = true
seccompiler.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# Resume every paused VM even when a warp (or a test's assert) unwinds
# mid-cluster.
scopeguard = "=1.2.0"

[features]
default = []
# When enabled, hides every non-`tree_model` module from the build (lib.rs
# gates them with `#[cfg(not(feature = "verif"))]`) so Charon and Aeneas only
# see the pure subset translated to Lean. Also drops the serde
# and thiserror proc-macro derives in `tree_model`.
verif = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
tempfile = "3"
env_logger.workspace = true

# The two-arm time-warp benchmark. Its own target rather
# than a test: one arm is ~10 minutes of guest time per run and it runs
# three per arm from a fresh cluster, so `make check` must not pay for
# it (`make remote-warp-bench`). `harness = false` because there is
# nothing for libtest to schedule — the arms have to run in order, from
# comparable node state.
[[bench]]
name = "warp_bench"
path = "benches/warp_bench.rs"
harness = false

# The dilation validation. Every test in it needs the
# carried KVM patch (`utils/kvm-dilation`) loaded, and every other
# spec's `remote-check` runs on stock modules — so it is not tested by
# default, and `make test` skips it by name too. `make dilation-test`
# (`cargo test -p k7d --test test_dilation`) is the way in.
[[test]]
name = "test_dilation"
path = "tests/test_dilation.rs"
test = false
