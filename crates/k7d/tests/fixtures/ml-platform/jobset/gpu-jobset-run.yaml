# In-flight 2-worker JobSet. Still Running at fork time.
# Same fake GPU request as gpu-jobset-done. Not CUDA.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: gpu-jobset-run
  namespace: default
spec:
  replicatedJobs:
  - name: workers
    replicas: 2
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: train
              image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              imagePullPolicy: IfNotPresent
              command: ["sleep", "86400"]
              resources:
                limits:
                  nvidia.com/gpu: "1"
                requests:
                  nvidia.com/gpu: "1"
