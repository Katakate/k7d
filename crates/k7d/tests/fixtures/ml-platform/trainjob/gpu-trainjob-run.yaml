# 2-worker TrainJob on the custom busybox TrainingRuntime .
# Each worker requests nvidia.com/gpu: 1 on the mock. trainer.command
# overwrites the runtime entrypoint the same way KubeRay's overwrite-cmd
# does — so Trainer cannot inject torchrun into busybox.
# Not CUDA, not a PyTorch / Trainer runtime image.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: gpu-trainjob-run
  namespace: default
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: TrainingRuntime
    name: busybox-cpu-gloo
  trainer:
    image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    numNodes: 2
    resourcesPerNode:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -eu
        mkdir -p /www
        echo "cpu-gloo $(hostname)" > /www/whoami
        httpd -p 8080 -h /www
        peers="gpu-trainjob-run-node-0-0.gpu-trainjob-run.default.svc.cluster.local gpu-trainjob-run-node-0-1.gpu-trainjob-run.default.svc.cluster.local"
        wait_url() {
          path="$1"
          for h in $peers; do
            n=0
            while [ "$n" -lt 30 ]; do
              if nslookup "$h" >/tmp/dns.out 2>&1 && wget -q -T 2 -O- "http://$h:8080$path" >/tmp/peer.out 2>&1; then
                echo "rendezvous ok $h $path $(cat /tmp/peer.out)"
                break
              fi
              n=$((n + 1))
              sleep 2
            done
            if [ "$n" -eq 30 ]; then
              echo "DNS/rendezvous failed for hostname $h path $path" >&2
              cat /tmp/dns.out >&2 || true
              exit 1
            fi
          done
        }
        wait_url /whoami
        echo done > /www/done
        wait_url /done
        echo "cpu-gloo train complete"
        sleep 86400
