# Drop-in installed by build-node-image.sh over every storage unit that
# orders itself after `network-online.target` .
#
# This image masks `systemd-networkd-wait-online` because k7d-net.service
# configures eth0 from the kernel command line, and a unit that waits on
# network-online.target then waits for its whole start timeout —
# CHALLENGES #108, which cost a boot-to-Ready hang on the k3s units.
# `iscsid` must actually run for Longhorn's attach path, so the ordering
# is cleared rather than the unit masked. The empty assignments reset the
# upstream lists; `local-fs.target` is deliberately the only ordering put
# back, because these units are pulled into the early transaction
# (`DefaultDependencies=no`, `WantedBy=sysinit.target`) and an ordering
# onto a late unit there is an ordering cycle systemd resolves by
# dropping some other job.
[Unit]
After=
Wants=
After=local-fs.target
