[workspace]
resolver = "2"
members = [
    "crates/k7d",
    "crates/shim",
    "crates/agent",
    "crates/replicate",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kvm-ioctls = "=0.19.1"
kvm-bindings = "=0.10.0"
vm-memory = "=0.17.1"
linux-loader = { version = "=0.13.2", features = ["elf", "bzimage"] }
vm-superio = "=0.8.1"
vmm-sys-util = "=0.12.1"
seccompiler = "=0.5.0"
vhost = "=0.12.0"
libc = "=0.2.184"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "=1.0.149"
tokio = { version = "=1.51.1", features = ["full"] }
log = "=0.4.29"
env_logger = "=0.11.10"
anyhow = "=1.0.104"
thiserror = "=2.0.18"
